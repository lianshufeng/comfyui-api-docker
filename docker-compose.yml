name: sensenova-u15-unified

services:
  sensenova:
    image: docker.cnb.cool/vvllm/comfyui-api:latest
    command: ["/usr/local/bin/start-unified.sh"]
    environment:
      DEBUG: true
      CUDA_VISIBLE_DEVICES: 1 # 多卡 0,1
      SENSENOVA_API_TOKEN: "${SENSENOVA_API_TOKEN:-}"
      CLI_ARGS: "--disable-xformers --disable-pinned-memory"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
    ports:
      - "8188:8188"
      - "8460:8460"
    volumes:
      - ./models/SenseNova-U1.5-8B-MoT-T8-int8:/models:ro
      - ./models/api-workflows:/opt/comfyui-api-workflows:ro
      - ./models/workflows:/opt/ComfyUI/user/default/workflows
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8460/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  qwen:
    profiles: [qwen]
    image: docker.cnb.cool/vvllm/comfyui-api:latest
    command: ["/usr/local/bin/start-unified.sh"]
    environment:
      CUDA_VISIBLE_DEVICES: 1
      COMFYUI_API_TOKEN: "${COMFYUI_API_TOKEN:-}"
      CLI_ARGS: "--disable-xformers --disable-pinned-memory"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
    ports:
      - "8189:8188"
      - "8461:8460"
    volumes:
      - ../../huggingface/Comfy-Org/Qwen-Image-2.1/qwen_image_2.1_int8_convrot.safetensors:/opt/ComfyUI/models/diffusion_models/qwen_image_2.1_int8_convrot.safetensors:ro
      - ../../huggingface/Comfy-Org/Qwen-Image-2.1/qwen3vl_8b_int8_convrot.safetensors:/opt/ComfyUI/models/text_encoders/qwen3vl_8b_int8_convrot.safetensors:ro
      - ../../huggingface/Comfy-Org/Qwen-Image-2.1/qwen_image_2.1_vae_bf16.safetensors:/opt/ComfyUI/models/vae/qwen_image_2.1_vae_bf16.safetensors:ro
      - ../../huggingface/Comfy-Org/Qwen-Image-2.1/api-workflows:/opt/comfyui-api-workflows:ro
      - ../../huggingface/Comfy-Org/Qwen-Image-2.1/output:/opt/ComfyUI/output
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8460/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
