name: sensenova-u15-unified

services:
  sensenova:
    profiles: [sensenova]
    image: docker.cnb.cool/vvllm/comfyui-api:latest
    command: ["--model", "SenseNova-U1.5-8B-MoT-T8-int8-convrot-tagged"]
    environment:
      DEBUG: true
      SENSENOVA_API_TOKEN: "${SENSENOVA_API_TOKEN:-}"
      # 3060 12GB 无法完整容纳 SenseNova 权重，保持当前低显存配置。
      # 显存充足时，可注释下一行并启用下面的 --highvram 配置，让首次出图后模型尽量保留在显存。
      # --highvram 与 --lowvram 不能同时使用；首次请求仍会加载模型，启动容器本身不会预热。
      CLI_ARGS: "--disable-xformers --disable-pinned-memory --lowvram"
      # CLI_ARGS: "--disable-xformers --disable-pinned-memory --highvram"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
    ports:
      - "8188:8188"
      - "8460:8460"
    volumes:
      - ../../huggingface/Comfy-Org/SenseNova-U1.5-8B-MoT-T8:/models:ro
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8460/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  qwen:
    profiles: [qwen]
    image: docker.cnb.cool/vvllm/comfyui-api:latest
    command: ["--model", "qwen_image_2.1_int8_convrot"]
    environment:
      COMFYUI_API_TOKEN: "${COMFYUI_API_TOKEN:-}"
      # 3060 12GB 无法完整容纳 Qwen 主模型、文本编码器和 VAE，保持当前低显存配置。
      # 显存充足时，可注释下一行并启用下面的 --highvram 配置，让首次出图后模型尽量保留在显存。
      # --highvram 与 --lowvram 不能同时使用；首次请求仍会加载模型，启动容器本身不会预热。
      CLI_ARGS: "--disable-xformers --disable-pinned-memory --lowvram"
      # CLI_ARGS: "--disable-xformers --disable-pinned-memory --highvram"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
    ports:
      - "8189:8188"
      - "8461:8460"
    volumes:
      - ../../huggingface/Comfy-Org/Qwen-Image-2.1:/models:ro
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8460/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
